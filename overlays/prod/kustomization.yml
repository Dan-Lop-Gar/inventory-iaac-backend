apiVersion: kustomize.config.k8s.io/v1
kind: Kustomization

resources:
  - ../../base

# En prod aumentamos réplicas y recursos
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: backend

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: envoy