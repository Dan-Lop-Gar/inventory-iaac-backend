apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: inventory-mgmt
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "inventory_db"
  KAFKA_BOOTSTRAP: "kafka:29092"
  KEYCLOAK_ISSUER: "http://keycloak:8080/realms/inventory"
  KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/inventory/protocol/openid-connect/certs"
  HAZELCAST_ADDRESS: "hazelcast:5701"
  SERVER_PORT: "8080"
  GRPC_SERVER_PORT: "9900"